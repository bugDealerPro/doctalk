services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doctalk
      POSTGRES_PASSWORD: doctalk
      POSTGRES_DB: doctalk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctalk -d doctalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://doctalk:doctalk@db:5432/doctalk
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

volumes:
  pgdata:
